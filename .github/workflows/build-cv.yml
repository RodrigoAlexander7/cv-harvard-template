name: Build CV PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.tex"
      - ".github/workflows/build-cv.yml"
  pull_request:
    paths:
      - "**.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV-Rodrigo-Fernandez-Huarca_harvard.tex
          latexmk_use_pdflatex: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: CV-Rodrigo-Fernandez-Huarca_harvard.pdf

      - name: Publish PDF to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CV-Rodrigo-Fernandez-Huarca_harvard.pdf
